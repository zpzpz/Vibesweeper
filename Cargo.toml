[package]
name = "minesweeper"
version = "0.1.0"
edition = "2021"
description = "A faithful Rust port of the classic Windows Minesweeper (winmine.exe 5.1)"

[lib]
name = "minesweeper"
path = "src/lib.rs"

[[bin]]
name = "minesweeper"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
eframe = { version = "0.36", optional = true }

[profile.release]
opt-level = 2
